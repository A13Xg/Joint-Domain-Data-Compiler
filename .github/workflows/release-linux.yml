name: Release (Linux)

# Publishes only the Linux AppImage and .deb into the `v<version>` release.
# Triggered by a `linux-v*` tag, or manually on demand.

on:
  push:
    tags: ['linux-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish under (defaults to package.json)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      platforms: '["linux"]'
      version: ${{ inputs.version || '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets: inherit

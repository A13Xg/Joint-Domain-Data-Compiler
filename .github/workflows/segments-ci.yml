name: Segmentation checks

on:
  pull_request:
    paths:
      - 'src/core/analytics/segments.ts'
      - 'test/segments.ts'
      - '.github/workflows/segments-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segmentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint segmentation implementation
        run: npx eslint src/core/analytics/segments.ts test/segments.ts
      - name: Run segmentation checks
        run: npx esbuild test/segments.ts --bundle --platform=node --format=esm --outfile=.test-build/segments.mjs && node .test-build/segments.mjs

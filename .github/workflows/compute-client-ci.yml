name: Compute client checks

on:
  pull_request:
    paths:
      - 'src/compute/client.ts'
      - 'test/compute-client.ts'
      - '.github/workflows/compute-client-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compute-client:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint compute client
        run: npx eslint src/compute/client.ts test/compute-client.ts
      - name: Run compute client checks
        run: npx esbuild test/compute-client.ts --bundle --platform=node --format=esm --outfile=.test-build/compute-client.mjs && node .test-build/compute-client.mjs

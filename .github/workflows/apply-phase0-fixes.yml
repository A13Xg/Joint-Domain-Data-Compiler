name: Apply Phase 0 build fixes

on:
  push:
    branches:
      - agent/data-semantics-and-correctness
    paths:
      - 'scripts/apply-phase0-build-fixes.py'
      - '.github/workflows/apply-phase0-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/data-semantics-and-correctness
          fetch-depth: 0

      - name: Apply verified source fixes
        run: python scripts/apply-phase0-build-fixes.py

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/core/transforms.ts src/ui/DataTable.tsx
          git commit -m 'Fix Phase 0 TypeScript build errors'
          git push origin HEAD:agent/data-semantics-and-correctness

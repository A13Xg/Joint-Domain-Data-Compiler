name: Relative analytics checks

on:
  pull_request:
    paths:
      - 'src/core/analytics/relative.ts'
      - 'src/core/geodesy.ts'
      - 'test/relative-analytics.ts'
      - '.github/workflows/relative-analytics-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relative-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint relative analytics implementation
        run: npx eslint src/core/analytics/relative.ts test/relative-analytics.ts
      - name: Run relative analytics checks
        run: npx esbuild test/relative-analytics.ts --bundle --platform=node --format=esm --outfile=.test-build/relative-analytics.mjs && node .test-build/relative-analytics.mjs

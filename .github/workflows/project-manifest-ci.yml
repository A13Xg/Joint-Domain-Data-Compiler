name: Project manifest checks

on:
  pull_request:
    paths:
      - 'src/persistence/project/**'
      - 'test/project-manifest.ts'
      - '.github/workflows/project-manifest-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint project manifest implementation
        run: npx eslint src/persistence/project test/project-manifest.ts
      - name: Run project manifest checks
        run: npx esbuild test/project-manifest.ts --bundle --platform=node --format=esm --outfile=.test-build/project-manifest.mjs && node .test-build/project-manifest.mjs

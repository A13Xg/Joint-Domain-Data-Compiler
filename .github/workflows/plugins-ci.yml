name: Plugin contract checks

on:
  pull_request:
    paths:
      - 'src/core/plugins/**'
      - 'test/plugins.ts'
      - '.github/workflows/plugins-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint plugin implementation
        run: npx eslint src/core/plugins test/plugins.ts
      - name: Run plugin checks
        run: npx esbuild test/plugins.ts --bundle --platform=node --format=esm --outfile=.test-build/plugins.mjs && node .test-build/plugins.mjs

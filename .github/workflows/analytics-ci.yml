name: Derived analytics checks

on:
  pull_request:
    paths:
      - 'src/core/analytics/**'
      - 'test/analytics.ts'
      - '.github/workflows/analytics-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint analytics implementation
        run: npx eslint src/core/analytics test/analytics.ts
      - name: Run analytics checks
        id: analytics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx esbuild test/analytics.ts --bundle --platform=node --format=esm --outfile=.test-build/analytics.mjs 2>&1 | tee analytics-report.txt
          node .test-build/analytics.mjs 2>&1 | tee -a analytics-report.txt
      - name: Upload analytics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-report
          path: analytics-report.txt
          if-no-files-found: error
      - name: Enforce analytics result
        if: steps.analytics.outcome == 'failure'
        run: exit 1

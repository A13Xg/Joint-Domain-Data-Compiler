name: Derived analytics checks

on:
  pull_request:
    paths:
      - 'src/core/analytics/**'
      - 'test/analytics.ts'
      - '.github/workflows/analytics-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint analytics implementation
        run: npx eslint src/core/analytics test/analytics.ts
      - name: Run analytics checks
        run: npx esbuild test/analytics.ts --bundle --platform=node --format=esm --outfile=.test-build/analytics.mjs && node .test-build/analytics.mjs

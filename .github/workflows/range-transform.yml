name: Range transform checks

on:
  pull_request:
    paths:
      - 'src/core/rangeTransform.ts'
      - 'src/ui/TransformPanel.tsx'
      - 'test/rangeTransform.ts'
      - '.github/workflows/range-transform.yml'

permissions:
  contents: read

jobs:
  range-transform:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint selected-range transform implementation
        run: npx eslint src/core/rangeTransform.ts src/ui/TransformPanel.tsx test/rangeTransform.ts
      - name: Run selected-range transform checks
        run: npx esbuild test/rangeTransform.ts --bundle --platform=node --format=esm --outfile=.test-build/range-transform.mjs && node .test-build/range-transform.mjs

name: Compute protocol checks

on:
  pull_request:
    paths:
      - 'src/compute/**'
      - 'test/compute.ts'
      - '.github/workflows/compute-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint compute implementation
        run: npx eslint src/compute test/compute.ts
      - name: Run compute checks
        run: npx esbuild test/compute.ts --bundle --platform=node --format=esm --outfile=.test-build/compute.mjs && node .test-build/compute.mjs

name: Chart series checks

on:
  pull_request:
    paths:
      - 'src/visualization/charts/series.ts'
      - 'test/chart-series.ts'
      - '.github/workflows/chart-series-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint chart series foundation
        run: npx eslint src/visualization/charts/series.ts test/chart-series.ts
      - name: Run chart series checks
        run: npx esbuild test/chart-series.ts --bundle --platform=node --format=esm --outfile=.test-build/chart-series.mjs && node .test-build/chart-series.mjs

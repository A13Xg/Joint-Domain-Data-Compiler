name: 3D trajectory geometry checks

on:
  pull_request:
    paths:
      - 'src/visualization/scene3d/trajectory.ts'
      - 'test/trajectory-3d.ts'
      - '.github/workflows/trajectory-3d-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trajectory-3d:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint 3D trajectory geometry
        run: npx eslint src/visualization/scene3d/trajectory.ts test/trajectory-3d.ts
      - name: Run 3D trajectory checks
        run: npx esbuild test/trajectory-3d.ts --bundle --platform=node --format=esm --outfile=.test-build/trajectory-3d.mjs && node .test-build/trajectory-3d.mjs

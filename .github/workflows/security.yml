name: Security and supply-chain checks

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security.yml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate npm audit report
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee npm-audit-report.txt
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > jddc-sbom.cdx.json
      - name: Validate SBOM JSON
        run: node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('jddc-sbom.cdx.json','utf8'));if(x.bomFormat!=='CycloneDX'||!Array.isArray(x.components))process.exit(1)"
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            npm-audit-report.txt
            jddc-sbom.cdx.json
          if-no-files-found: error
      - name: Enforce high-severity audit result
        if: steps.audit.outcome == 'failure'
        run: exit 1

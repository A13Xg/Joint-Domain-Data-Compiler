name: Release (all platforms)

# Builds and publishes Linux, Windows, and macOS together.
# Triggered by a `v*` version tag, or manually on demand.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish under (defaults to package.json)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-all-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      platforms: '["linux","windows","macos"]'
      version: ${{ inputs.version || '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      actions: write
    secrets: inherit

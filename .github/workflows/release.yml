name: Release

# Builds and publishes Linux and Windows on a `v*` version tag.
#
# macOS is deliberately NOT on that automatic path: macOS runners bill at 10x
# on GitHub Free, which makes an unattended mac build by far the most expensive
# thing this repository can do by accident. It is published on purpose instead
# — either by running this workflow by hand with "Also build macOS" ticked, or
# by the dedicated Release (macOS) workflow. Both publish into the same
# `v<version>` release as the tag build, adding their artifacts alongside the
# ones already attached rather than replacing them.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish under (defaults to package.json)'
        required: false
        type: string
        default: ''
      include_macos:
        description: 'Also build macOS (10x runner cost)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-all-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      # On a tag push the `inputs` context is empty, so this falls to the
      # two-platform set — a tagged release cannot reach for a mac runner on
      # its own no matter how the tag was pushed.
      platforms: ${{ inputs.include_macos && '["linux","windows","macos"]' || '["linux","windows"]' }}
      version: ${{ inputs.version || '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      actions: write
    secrets: inherit

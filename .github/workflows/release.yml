name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_command: npm run build:desktop:linux
            artifact_glob: |
              release/*.AppImage
              release/*.deb
          - os: windows-latest
            build_command: npm run build:desktop:win
            artifact_glob: |
              release/*Windows*x64*Setup.exe
              release/*Windows*x64*Portable.exe
              release/SHA256SUMS-Windows.txt
          - os: macos-latest
            build_command: npm run build:desktop
            artifact_glob: |
              release/*.dmg
              release/*.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install GPX schema validator
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION" || {
            echo "Tag version $TAG_VERSION does not match package.json $PACKAGE_VERSION"
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Run conversion validation tests
        run: npm test

      - name: Build and package app
        run: ${{ matrix.build_command }}

      - name: Verify Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path release -Filter "*Windows*x64*Setup.exe"
          $portable = Get-ChildItem -Path release -Filter "*Windows*x64*Portable.exe"
          if ($setup.Count -ne 1) { throw "Expected exactly one Windows NSIS setup executable, found $($setup.Count)." }
          if ($portable.Count -ne 1) { throw "Expected exactly one Windows portable executable, found $($portable.Count)." }
          if ($setup[0].Length -lt 1MB) { throw "Windows setup executable is unexpectedly small." }
          if ($portable[0].Length -lt 1MB) { throw "Windows portable executable is unexpectedly small." }

      - name: Generate Windows SHA-256 checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path release -Filter "*.exe" |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Set-Content -Path release/SHA256SUMS-Windows.txt -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-release
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-bundle

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find release-bundle -type f -exec cp {} release/ \;
          echo "Files to publish:"
          find release -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Verify release contains Windows binaries
        run: |
          find release -maxdepth 1 -type f -name '*Windows*x64*Setup.exe' | grep -q .
          find release -maxdepth 1 -type f -name '*Windows*x64*Portable.exe' | grep -q .
          test -f release/SHA256SUMS-Windows.txt

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

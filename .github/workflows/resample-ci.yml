name: Resampling checks

on:
  pull_request:
    paths:
      - 'src/core/operations/resample.ts'
      - 'test/resample.ts'
      - '.github/workflows/resample-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resampling:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint resampling implementation
        run: npx eslint src/core/operations/resample.ts test/resample.ts
      - name: Run resampling checks
        run: npx esbuild test/resample.ts --bundle --platform=node --format=esm --outfile=.test-build/resample.mjs && node .test-build/resample.mjs

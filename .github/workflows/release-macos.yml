name: Release (macOS)

# Publishes only the macOS .dmg and .zip into the `v<version>` release.
# Triggered by a `mac-v*` tag, or manually on demand.
# macOS runners bill at 10x minutes on GitHub Free, which makes this by far
# the most expensive release path -- run it deliberately.

on:
  push:
    tags: ['mac-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish under (defaults to package.json)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      platforms: '["macos"]'
      version: ${{ inputs.version || '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets: inherit

name: Selection model checks

on:
  pull_request:
    paths:
      - 'src/core/selection.ts'
      - 'test/selection.ts'
      - 'package.json'
      - '.github/workflows/selection-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selection:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint selection model
        run: npx eslint src/core/selection.ts test/selection.ts
      - name: Run selection checks
        run: npx esbuild test/selection.ts --bundle --platform=node --format=esm --outfile=.test-build/selection.mjs && node .test-build/selection.mjs

name: Static analysis

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - agent/roadmap-integration
  schedule:
    - cron: '31 6 * * 1'

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep CE security scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Scan production TypeScript and JavaScript
        id: semgrep
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          semgrep scan --config auto --error src electron scripts 2>&1 | tee semgrep-report.txt

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.txt
          if-no-files-found: error

      - name: Enforce Semgrep result
        if: steps.semgrep.outcome == 'failure'
        run: exit 1

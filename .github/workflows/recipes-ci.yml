name: Operation recipe checks

on:
  pull_request:
    paths:
      - 'src/core/recipes/**'
      - 'test/recipes.ts'
      - '.github/workflows/recipes-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint recipe implementation
        run: npx eslint src/core/recipes test/recipes.ts
      - name: Run recipe checks
        run: npx esbuild test/recipes.ts --bundle --platform=node --format=esm --outfile=.test-build/recipes.mjs && node .test-build/recipes.mjs

name: Compute worker checks

on:
  pull_request:
    paths:
      - 'src/compute/tasks.ts'
      - 'src/compute/workerRuntime.ts'
      - 'src/compute/worker.ts'
      - 'test/computeWorker.ts'
      - '.github/workflows/compute-worker.yml'

permissions:
  contents: read

jobs:
  compute-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint production worker implementation
        run: npx eslint src/compute/tasks.ts src/compute/workerRuntime.ts src/compute/worker.ts test/computeWorker.ts
      - name: Run compute worker checks
        run: npx esbuild test/computeWorker.ts --bundle --platform=node --format=esm --outfile=.test-build/compute-worker.mjs && node .test-build/compute-worker.mjs

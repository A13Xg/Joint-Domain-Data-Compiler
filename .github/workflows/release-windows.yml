name: Release (Windows)

# Publishes only the Windows installer and portable executable into the
# `v<version>` release. Triggered by a `win-v*` tag, or manually on demand.
# Windows runners bill at 2x, so this is deliberately not part of CI.

on:
  push:
    tags: ['win-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish under (defaults to package.json)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      platforms: '["windows"]'
      version: ${{ inputs.version || '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets: inherit

name: Quality Gates

# Paths listed below are inputs to no gate this workflow runs -- not to the
# lint pass, not to a test harness, not to `vite build`, and not to the health
# check -- so a change confined to them has nothing here to fail. A push or PR
# is skipped only when EVERY changed file matches, so the moment one touches
# code the full suite runs as before. `workflow_dispatch` ignores path filters
# entirely, which stays the way to force a run over any change at all.
#
# Deliberately absent, because each one IS a build or lint input:
#   KML-KMZ/**   vite.config.ts serves it to the browser build at
#                `kml-library/`, and electron-builder packages it as
#                extraResources on all three platforms.
#   public/**    copied wholesale into dist/, including the user guide.
#   benchmarks/  TypeScript, and covered by its own eslint config block.
#   .github/**   a workflow edit is exactly the change worth verifying.
#
# The two lists below are duplicated rather than shared: GitHub Actions does
# not support YAML anchors, so an alias cannot stand in for the second copy.
# Keep them identical.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      # Source artwork only. The packaged assets derived from it --
      # build/icon.png and electron/splash.png -- live elsewhere and are not
      # ignored.
      - 'images/**'
      - '.agents/**'
      - '.claude/**'
      - '.vscode/**'
      - '.gitattributes'
      - '.gitignore'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'images/**'
      - '.agents/**'
      - '.claude/**'
      - '.vscode/**'
      - '.gitattributes'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and build verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # xmllint backs the GPX/KML schema assertions in test/validate.ts.
      # Without it those checks silently skip rather than fail.
      - name: Install GPX schema validator
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Install dependencies
        run: npm ci

      - name: Lint and run regression suite
        run: npm run check:unit

      - name: Build web application
        run: npm run check:web

      - name: Verify the built application is intact
        run: node scripts/check-app-health.mjs

      - name: Audit shipped runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  # Tags main with `v<version>` the moment a commit changes package.json's
  # major or minor version component -- the "manual change by the dev" step
  # in the versioning scheme (see CONTRIBUTING.md). The tag push is what
  # starts a release: release.yml triggers on `v*` tags, same as a tag pushed
  # by hand. A patch-only commit (the pre-commit hook's auto-increment) never
  # matches, so a release is still never built just because main moved.
  auto-tag-release:
    name: Tag release on version bump
    needs: [test]
    if: github.event_name == 'push' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Compare version to the previous commit
        id: version
        run: |
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          if git cat-file -e HEAD^:package.json 2>/dev/null; then
            PREVIOUS_VERSION="$(git show HEAD^:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          else
            PREVIOUS_VERSION=""
          fi
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          PREVIOUS_VERSION="$PREVIOUS_VERSION" CURRENT_VERSION="$CURRENT_VERSION" node scripts/check-version-bump.mjs >> "$GITHUB_OUTPUT"

      - name: Tag and push
        if: steps.version.outputs.should_tag == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

  # Housekeeping, not a gate: runs after the verdict is in, never blocks it.
  # Restricted to pushes because a pull_request event from a fork gets a
  # read-only token, and pruning from a PR run serves no purpose anyway.
  prune:
    name: Prune old runs
    needs: [test]
    if: always() && github.event_name == 'push'
    uses: ./.github/workflows/_prune-runs.yml
    with:
      keep: '30'
    permissions:
      contents: read
      actions: write

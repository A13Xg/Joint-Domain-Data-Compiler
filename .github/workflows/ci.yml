name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d632683dd7b4114d4e6ca60534b3783c8c73d4c1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@0a44ba7841707b7fe618dbbf4107c368b0dec200 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install GPX schema validator
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Install dependencies
        run: npm ci

      - name: Lint and run the complete regression suite (check:unit)
        run: npm run check:unit

      - name: Build web application (check:web)
        run: npm run check:web

  browser-smoke:
    name: Browser workbench smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d632683dd7b4114d4e6ca60534b3783c8c73d4c1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@0a44ba7841707b7fe618dbbf4107c368b0dec200 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Exercise the primary browser workflow
        run: npm run check:e2e

      - name: Upload browser failure report
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@6f51b1e2c4af15367c4595661c38db3fd7e0e694 # v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 3

  security:
    name: Runtime dependency audit and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d632683dd7b4114d4e6ca60534b3783c8c73d4c1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@0a44ba7841707b7fe618dbbf4107c368b0dec200 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit shipped runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > jddc-sbom.cdx.json

      - name: Upload security report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@6f51b1e2c4af15367c4595661c38db3fd7e0e694 # v4
        with:
          name: security-report-${{ github.sha }}
          path: jddc-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 3

  static-analysis:
    name: Semgrep static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep@sha256:691e6b67d374edd3f546a123c0255fd281a63a2bf11ca9dda51fb1a735fa3264
    steps:
      - name: Check out source
        uses: actions/checkout@d632683dd7b4114d4e6ca60534b3783c8c73d4c1 # v4

      - name: Scan production source
        run: semgrep scan --config auto --error src electron scripts
